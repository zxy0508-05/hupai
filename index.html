<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唬牌联机</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:700px;margin:10px auto;padding:10px;background:#f7f7f7;}
.box{background:white;padding:16px;border-radius:10px;margin-bottom:12px;box-shadow:0 1px 4px #0002;}
input{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:6px;margin:6px 0;}
button{padding:10px 14px;font-size:16px;border:none;border-radius:6px;background:#2563eb;color:white;margin:4px;cursor:pointer;}
button:disabled{background:#aaa;cursor:not-allowed;}
.card{display:inline-block;width:44px;height:64px;background:#fff;border:1px solid #444;border-radius:6px;text-align:center;line-height:64px;margin:2px;font-size:18px;cursor:pointer;}
.card.selected{background:#b8daff;}
.info{color:#333}
</style>
</head>
<body>
<div class="box">
<h2>唬牌联机游戏</h2>
<div id="joinArea">
<input id="roomInput" placeholder="输入房间号，例如999">
<button onclick="joinRoom()">加入房间</button>
<div class="info">状态：未连接</div>
</div>
<div id="gameArea" style="display:none;">
<div class="info">
<div>房间人数：<span id="cnt">0</span>/2</div>
<div id="turnTip"></div>
<div>桌面上牌堆数量：<span id="pileCnt">0</span></div>
</div>
<div class="box">
<h4>我的手牌（点击选中出牌）</h4>
<div id="handDiv"></div>
<div>
<label><input type="checkbox" id="isLie"> 这张牌谎报（唬）</label>
<button id="playBtn" onclick="play()" disabled>打出选中牌</button>
<button id="callBtn" onclick="call()" disabled>开牌查验</button>
</div>
</div>
</div>
<div id="winBox" class="box" style="display:none">
<h2 id="winText"></h2>
<button onclick="location.reload()">重新开局</button>
</div>
<script>
let ws = null;
let selfId = null;
let selectedCardIndex = null;
let gameState = {};

// 适配 render https
const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
ws = new WebSocket(`${proto}//${window.location.host}`);

ws.onopen = ()=>{
    document.querySelector(".info").innerText = "已连接，请输入房间号";
}
ws.onclose = ()=>{
    document.querySelector(".info").innerText = "连接服务器失败，请刷新";
}
ws.onmessage = (ev)=>{
    const d = JSON.parse(ev.data);
    if(d.type === "error"){
        alert(d.text);
        return;
    }
    if(d.type === "state"){
        selfId = d.selfId;
        gameState = d;
        renderGame();
    }
    if(d.type === "win"){
        document.getElementById("gameArea").style.display="none";
        document.getElementById("winBox").style.display="block";
        document.getElementById("winText").innerText = d.winner ? "🎉你赢了！" : "😥你输了";
    }
}

function joinRoom(){
    const rid = document.getElementById("roomInput").value.trim();
    if(!rid){alert("请输入房间号");return;}
    ws.send(JSON.stringify({type:"join", roomId:rid}));
    document.getElementById("joinArea").style.display="none";
    document.getElementById("gameArea").style.display="block";
}

function renderGame(){
    document.getElementById("cnt").innerText = gameState.playersCount;
    document.getElementById("pileCnt").innerText = gameState.pileLen;
    const myHand = gameState.myHand || [];
    const handDiv = document.getElementById("handDiv");
    handDiv.innerHTML = "";
    selectedCardIndex=null;
    myHand.forEach((_,idx)=>{
        const div = document.createElement("div");
        div.className = "card";
        div.innerText = "🃏";
        if(selectedCardIndex===idx) div.classList.add("selected");
        div.onclick = ()=>{
            selectedCardIndex = idx;
            renderGame();
        }
        handDiv.appendChild(div);
    })
    const myIdx = gameState.playerIndex;
    const isMyTurn = gameState.turnIdx === myIdx;
    document.getElementById("turnTip").innerText = gameState.gameStart ? (isMyTurn ? "✅轮到你操作" : "⏳等待对手操作"):"等待第二个玩家进入房间";
    document.getElementById("playBtn").disabled = !(isMyTurn && selectedCardIndex!==null && gameState.gameStart);
    document.getElementById("callBtn").disabled = !(isMyTurn && gameState.pileLen>0 && gameState.gameStart);
}

function play(){
    if(selectedCardIndex===null) return;
    const lie = document.getElementById("isLie").checked;
    ws.send(JSON.stringify({type:"playCard", cardIndex:selectedCardIndex, lie:lie}));
    document.getElementById("isLie").checked = false;
}

function call(){
    ws.send(JSON.stringify({type:"call"}));
}
</script>
</body>
</html>
